[project]
name = "cofre-senhas-aes256"
version = "0.1.0"
description = "Cofre local de senhas cifrado AES-256 (PBKDF2-HMAC-SHA256 + AES-256-GCM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0,<51",
]

[project.scripts]
cofre-senhas = "cofre_senhas_aes256.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
